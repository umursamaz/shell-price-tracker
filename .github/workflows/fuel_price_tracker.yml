name: Shell Motorin Fiyat Takip

on:
  schedule:
    - cron: '0 21 * * *'  # Her gün 21:00 UTC = 00:00 TR
  workflow_dispatch:

jobs:
  track-fuel-price:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Gerekli Paketleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Chrome Kurulumu
      uses: browser-actions/setup-chrome@latest
      with:
        chrome-version: stable

    - name: Chrome Driver Kurulumu
      uses: nanasess/setup-chromedriver@v2

    - name: Fiyat Takibi Çalıştır
      env:
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        SMTP_KEY: ${{ secrets.SMTP_KEY }}
        SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
        EMAIL_RECEIVER_ISTANBUL: ${{ secrets.EMAIL_RECEIVER_ISTANBUL }}
        EMAIL_RECEIVER_AKSARAY: ${{ secrets.EMAIL_RECEIVER_AKSARAY }}
        EMAIL_RECEIVER_ANKARA: ${{ secrets.EMAIL_RECEIVER_ANKARA }}
      run: python price_tracker.py

    - name: CSV Dosyasını Commit'le
      if: success()
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        git add motorin_fiyatlari.csv
        git diff --staged --quiet || git commit -m "🤖 Günlük fiyat verileri güncellendi ($(date +'%Y-%m-%d'))"
        git push

    - name: Hata Durumunda Screenshot Kaydet
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: error-screenshots
        path: hata_screenshot_*.png
        if-no-files-found: ignore
