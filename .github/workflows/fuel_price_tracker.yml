name: Shell Motorin Fiyat Takip

on:
  schedule:
    # Saatler UTC (TR = UTC+3). Shell günün fiyat listesini ~06:10 TR'de yayınlıyor.
    # İlk deneme 06:20 TR; liste henüz yoksa veya panele ulaşılamazsa saat başı tekrar denenir.
    # Gönderim yapıldıktan sonraki denemeler CSV'de bugünün satırını görüp hiçbir şey yapmaz.
    # :20 seçildi, GitHub saat başındaki zamanlanmış işleri çok geciktiriyor.
    - cron: '20 3 * * *'   # 06:20 TR
    - cron: '20 4 * * *'   # 07:20 TR
    - cron: '20 5 * * *'   # 08:20 TR
    - cron: '20 6 * * *'   # 09:20 TR, son deneme: Shell'den alınamazsa doviz.com
  workflow_dispatch:
    inputs:
      son_deneme:
        description: "Shell'den alınamazsa doviz.com kullanılsın mı?"
        type: boolean
        default: false

# Geciken denemeler üst üste binip aynı gün iki kez mail atmasın
concurrency:
  group: fuel-price-tracker
  cancel-in-progress: false

jobs:
  track-fuel-price:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        # Tetiklenme anındaki commit yerine en güncel main: önceki denemenin kaydettiği CSV görülsün
        ref: main

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Gerekli Paketleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Chrome Kurulumu
      uses: browser-actions/setup-chrome@latest
      with:
        chrome-version: stable

    - name: Chrome Driver Kurulumu
      uses: nanasess/setup-chromedriver@v2

    - name: Fiyat Takibi Çalıştır
      env:
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        SMTP_KEY: ${{ secrets.SMTP_KEY }}
        SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
        EMAIL_RECEIVER_ISTANBUL: ${{ secrets.EMAIL_RECEIVER_ISTANBUL }}
        EMAIL_RECEIVER_AKSARAY: ${{ secrets.EMAIL_RECEIVER_AKSARAY }}
        EMAIL_RECEIVER_ANKARA: ${{ secrets.EMAIL_RECEIVER_ANKARA }}
        SON_DENEME: ${{ github.event.schedule == '20 6 * * *' || inputs.son_deneme == true }}
      run: python price_tracker.py

    - name: CSV Dosyasını Commit'le
      # Bir lokasyon hata verse de gönderilenler kaydedilsin, sonraki deneme onlara tekrar mail atmasın
      if: ${{ !cancelled() }}
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        git add motorin_fiyatlari.csv
        git diff --staged --quiet || { git commit -m "🤖 Günlük fiyat verileri güncellendi ($(TZ=Europe/Istanbul date +'%Y-%m-%d'))" && git push; }

    - name: Hata Screenshot'larını Kaydet
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: error-screenshots
        path: hata_screenshot_*.png
        if-no-files-found: ignore
